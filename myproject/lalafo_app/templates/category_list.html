<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории товаров</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-emerald-50/60 min-h-screen text-slate-800 font-sans">

    <!-- Шапка страницы -->
    <header class="bg-emerald-600 shadow-md py-6 px-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-white flex items-center gap-2">
                <i class="fa-solid fa-shapes text-yellow-400"></i>
                <span>Категории объявлений</span>
            </h1>
            <span class="bg-yellow-400 text-emerald-950 font-bold px-3 py-1 rounded-full text-xs sm:text-sm shadow-sm">
                Lalafo Style
            </span>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            {% for i in categories %}
            <a href="#" class="group relative bg-white rounded-2xl p-4 shadow-sm hover:shadow-xl transition-all duration-300 border border-emerald-100/80 hover:-translate-y-1 flex flex-col items-center justify-between overflow-hidden">
                
                <!-- Декоративный зеленый и желтый акцент при наведении -->
                <div class="absolute top-0 left-0 w-full h-1.5 bg-yellow-400 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                
                <!-- Изображение категории -->
                <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-emerald-50 border-2 border-emerald-100 flex items-center justify-center overflow-hidden mb-3 group-hover:border-yellow-400 transition-colors">
                    {% if i.category_image %}
                        <img src="{{ i.category_image.url }}" alt="{{ i.category_name }}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    {% else %}
                        <i class="fa-solid fa-image text-3xl text-emerald-300"></i>
                    {% endif %}
                </div>

                <!-- Название категории -->
                <p class="font-bold text-center text-slate-700 group-hover:text-emerald-700 text-sm sm:text-base line-clamp-2 transition-colors">
                    {{ i.category_name }}
                </p>

                <!-- Желтый бейджик при ховере -->
                <div class="mt-3 opacity-0 group-hover:opacity-100 transition-opacity text-xs font-semibold text-emerald-900 bg-yellow-300 px-3 py-1 rounded-full flex items-center gap-1">
                    <span>Смотреть</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </div>
            </a>
            {% empty %}
            <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-emerald-100 shadow-sm">
                <i class="fa-solid fa-folder-open text-4xl text-emerald-300 mb-2"></i>
                <p class="text-slate-500 font-medium">Категории пока не добавлены.</p>
            </div>
            {% endfor %}
        </div>

    </main>

</body>
</html>
